name: weixin

on:
  workflow_dispatch:
  schedule:
    # 国际标准时间，北京时间需 +8 小时；00 23 = 北京时间次日 07:00
    # 注意：GitHub 定时任务常排队延迟 1~3 小时，实际到达时间会晚于 07:00
    - cron: '00 23 * * *'

env:
  # 固定为北京时间，规避时区导致的日期不准
  TZ: 'Asia/Shanghai'

# 同一时间只跑一个，避免排队积压时连发多条
concurrency:
  group: weixin-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: install pip packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: weixin
        env:
          WX_APP_ID: ${{ secrets.WX_APP_ID }}
          WX_APP_SECRET: ${{ secrets.WX_APP_SECRET }}
        run: python main.py
